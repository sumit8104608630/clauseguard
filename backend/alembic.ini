# Alembic configuration for the Contract Analyzer backend.
#
# NOTE: `sqlalchemy.url` below is intentionally left blank — alembic/env.py
# overrides it at runtime with `settings.DATABASE_URL` from backend/.env, so the
# credentials never live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamp each migration filename with the local time.
file_template = %%(rev)s_%%(slug)s

# Set by env.py from the .env file.
sqlalchemy.url =


[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88


# ---------------------------------------------------------------------------
# Logging configuration (consumed by `fileConfig` in alembic/env.py)
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
